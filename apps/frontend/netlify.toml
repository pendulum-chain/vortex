# Netlify config for the widget/marketing frontend site.
#
# Requires the Netlify site's "Base directory" to be set to `apps/frontend`.
# CAUTION: once this file is on the deployed branch it overrides the build settings
# configured in the Netlify UI — review it against the current UI configuration.
#
# Redirect rules live in `_redirects` (copied into dist/client by the build), not here.
# Marketing routes are prerendered to static HTML by TanStack Start, so they are plain files
# under `dist/client`; only the SSR-disabled widget route needs a rewrite.
# Gold (apps/gold) is a separate Vite app built with base /pt-br/gold/ and copied into the
# published tree next to the prerendered locale pages (the pt-BR directory; Netlify matches
# files case-insensitively), so it is served as plain files before any redirect rule applies.
# Gold's build reads these site variables (set in the Netlify UI for all contexts):
#   VITE_PRIVY_APP_ID   – the Privy app id (without it Gold renders a config error); the
#                         original gold.satoshipay.io release used cmtiwhqgf01uu0el8lx3ejr35
#   VITE_DEMO_MODE      – must be "false"; any other value ships the no-money demo
# It shares VITE_SIGNING_SERVICE_PATH with the frontend, so API routing follows the context.
# Stocks uses the same Privy app and API proxy. Its independent VITE_STOCKS_MODE flag defaults
# to live in this build, with the actual ramp disabled unless VITE_STOCKS_RAMP_ENABLED=true.
# Deploy previews use the explicitly labelled, no-money demo without Privy onboarding.
# English /en/stocks/ ships in live too; execution uses VITE_STOCKS_USDC_ENABLED independently.
# A bad mode fails the Stocks build, and production fails unless the mode is live. Staging runs
# as a branch deploy on this site, so scope VITE_STOCKS_RAMP_ENABLED per context in the UI
# rather than overriding branch deploys here.
# The dashboard is a separate Netlify site (apps/dashboard/netlify.toml) served on its
# own domain; this build does not include it.

# The deployed branches never skip a build. `ignore` below compares against $CACHED_COMMIT_REF, which
# is the branch's last build only while its build cache exists. A cache lapses about 16 days after the
# build that wrote it, and a cancelled build writes none. Without one, the variable holds the default
# branch (staging) head, whatever Netlify's docs say, so staging and release merges into main compare
# equal, cancel, and keep cancelling. `[context.staging]` also covers release PR previews.
[context.production]
  ignore = "/bin/false"

[context.staging]
  ignore = "/bin/false"

[build]
  command = "cd ../.. && bun install --frozen-lockfile && bun run build:shared && bun run build:sdk && bun run build:frontend && bun run build:gold && VITE_STOCKS_MODE=${VITE_STOCKS_MODE:-live} bun run build:stocks && mkdir -p apps/frontend/dist/client/pt-BR/gold apps/frontend/dist/client/pt-BR/stocks && cp -R apps/gold/dist/client/. apps/frontend/dist/client/pt-BR/gold/ && cp -R apps/stocks/dist/client/. apps/frontend/dist/client/pt-BR/stocks/ && if [ -f apps/stocks/dist/client/international.html ]; then mkdir -p apps/frontend/dist/client/en/stocks && cp apps/stocks/dist/client/international.html apps/frontend/dist/client/en/stocks/index.html; fi"
  publish = "dist/client"
  # Netlify does not read .bun-version, and this overrides the older BUN_VERSION set in its UI.
  environment = { BUN_VERSION = "1.4.4" }
  # Netlify's default ignore check only diffs the base directory, so a commit touching only
  # apps/gold or the shared/sdk packages would be skipped as "no content change". Build when
  # any input of this site changed (paths are relative to the base directory).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../gold ../stocks ../../packages/consumer-kit ../../packages/shared ../../packages/sdk"

[context.deploy-preview.environment]
  VITE_STOCKS_MODE = "demo"

# Gold signs Ethereum transactions and collects PIX keys and KYC data, so it must not be framed
# by other sites (clickjacking) and keeps the baseline headers of its standalone release
# (gold.satoshipay.io). Scoped to Gold so the rest of the site, e.g. the widget, is unchanged.
[[headers]]
  for = "/pt-br/gold/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/pt-br/stocks/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/en/stocks/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex"
